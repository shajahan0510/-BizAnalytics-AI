<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – AI Business Analytics</title>
  <meta name="description" content="Create an account to access the AI Business Analytics platform." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="register">
  <div class="bg-mesh"></div>

  <div class="auth-page">
    <div class="card auth-card">

      <div class="auth-logo">
        <div class="logo-icon-lg">📊</div>
        <h1>Create Account</h1>
        <p>Start your AI analytics journey</p>
      </div>

      <div id="alert" class="alert alert-error"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.85rem;">
          Create Account →
        </button>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    const SB_SCRIPT = document.createElement("script");
    SB_SCRIPT.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
    document.head.appendChild(SB_SCRIPT);

    const form    = document.getElementById("register-form");
    const alertEl = document.getElementById("alert");

    function showAlert(msg, type = "error") {
      alertEl.textContent = msg;
      alertEl.className = `alert alert-${type} show`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name     = document.getElementById("fullname").value.trim();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;

      if (!name || !email || !password) return showAlert("Please fill in all fields.");
      if (password !== confirm) return showAlert("Passwords do not match.");
      if (password.length < 6) return showAlert("Password must be at least 6 characters.");

      // If Supabase not configured, simulate registration
      if (SUPABASE_CONFIG.url.includes("YOUR_PROJECT_ID")) {
        showAlert("Account created! Redirecting to login…", "success");
        setTimeout(() => window.location.href = "login.html", 1800);
        return;
      }

      try {
        await new Promise(r => { if (window.supabase) r(); else SB_SCRIPT.onload = r; });
        const client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
        const { error } = await client.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) return showAlert(error.message);
        showAlert("✅ Account created! Check your email to confirm, then sign in.", "success");
        setTimeout(() => window.location.href = "login.html", 2500);
      } catch {
        showAlert("Connection error. Please try again.");
      }
    });
  </script>
</body>
</html>
